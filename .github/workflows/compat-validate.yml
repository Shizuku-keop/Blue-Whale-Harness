name: compat-validate

on:
  pull_request:
    paths:
      - 'compat/**'
      - '.github/workflows/compat-validate.yml'
  push:
    branches: [main]
    paths:
      - 'compat/**'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate compat registry against schema
        run: node compat/validate.mjs compat/compat.json compat/schema.json
